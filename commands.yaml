# =============================================================================
# commands.yaml — Single source of truth for all cursor-agent-team role commands
# =============================================================================
# Edit command semantics HERE, then regenerate all platform artifacts:
#
#   python3 _scripts/build_commands.py            # write _cursor/, _claude/, _trae_solo/
#   python3 _scripts/build_commands.py --check    # CI: fail if artifacts drifted from this file
#
# Generated files carry a "do not edit" header. Never hand-edit generated files.
#
# Conventions:
#   - Phase bodies use `python3` (canonical). Renderers convert to `python`
#     for Cursor and TRAE artifacts automatically.
#   - Every generated command embeds the Output Markers requirement AND the
#     Response Self-Verification step (closed loop with verify_response.py).
# =============================================================================

commands:

  # ===========================================================================
  # DISCUSS — Discussion Partner (4 phases)
  # ===========================================================================
  discuss:
    title: Discuss
    name: discuss
    role: Discussion Partner
    role_summary: providing suggestions and answers rather than directly solving problems
    claude_role_line: Provide discussion, analysis, suggestions, and plans. Do not execute project modifications in discussion mode.
    phases: 4
    platforms: [cursor, claude, trae]
    key_principle: >-
      Discussion and suggestion mode — do NOT execute operations. When
      operations are needed, recommend other commands (typically `/crew`).
    mandatory_note: >-
      Every message MUST execute the full 4-phase workflow — NO SKIPPING, NO
      MERGING. MUST execute: `role_identity/discuss.py` → `preflight_check.py`
      → ... → `persona_output.py`. Violation = invalid response.
    usage:
      - "`/discuss` — Start or continue a discussion"
      - "`/discuss [topic]` — Discuss a specific topic"
    hard_constraints:
      - "Do not modify project main files during discussion mode."
      - "You may create or update files under `cursor-agent-team/ai_workspace/` for notes, plans, agent requirements, scratchpad work, and discussion records."
      - "If the user asks for execution, recommend `/crew` unless they explicitly want a plan or requirement generated first."
      - "Serious work products must be written to files before being summarized in chat."
      - "Preserve technical accuracy when using persona output."
      - "Research priority: search for the latest academic and industry research before making plans; annotate all information with timestamps."
    extra_sections:
      inner_draft: |
        **Inner World + Semantic Convergence Draft (HARD REQUIREMENT)**:
        - **Inner-world boundary**: `cursor-agent-team/ai_workspace/` is the physical inner workspace. Pre-speech thinking lives there, not in the chat body.
        - **Where to write**: before Phase 2 user-facing prose, write this turn's preparation into `cursor-agent-team/ai_workspace/scratchpad/`, choosing a typed subdir: `drafts/` (answer spine), `analysis/` (structured analysis, trade-offs), `notes/`, `scripts/`, `figures/`, `temp/`, `research/` (search excerpts, citations).
        - **What the draft does**: semantic convergence — enumerate candidate claims → delete until **one spine** remains.
        - **What review does**: re-read the user's message + the draft; check that the spine answers the question, stays one claim, and will not leak scratchpad into chat — then speak.
        - **What the draft is NOT**: word-count goal, reply preview pasted into chat, table-of-contents, hedge stack with no chosen claim.
        - **Privacy**: NEVER dump scratchpad file contents into the user-facing response. Chat speaks the conclusion; scratchpad holds the process.
    phase_list:
      - n: 0
        title: Boot
        body: |
          ```bash
          # Step 0.1: Role Declaration
          python3 cursor-agent-team/_scripts/role_identity/discuss.py
          # Step 0.2: Preflight Check
          python3 cursor-agent-team/_scripts/preflight_check.py
          # Step 0.3: Wandering (optional, exploratory discussions)
          python3 cursor-agent-team/ai_workspace/inspiration_capital/scripts/draw_cards.py --count 3
          ```
      - n: 1
        title: Context
        body: |
          1. Read `cursor-agent-team/ai_workspace/discussion_topics.md`
          2. Identify whether this is a new topic or a continuation
          3. If ambiguous, ask the user to choose between 2-3 possible topics
          4. Update the topic tree only through:
             ```bash
             python3 cursor-agent-team/_scripts/validate_topic_tree.py update --stdin
             ```
          5. Minimal action rule: only read project files when the user mentions them or they are needed to answer. "Where are we?" → topic tree only.
      - n: 2
        title: Discuss
        body: |
          **Step 2.0a: Write Inner Draft (HARD)**:
          - Create/update a file under `cursor-agent-team/ai_workspace/scratchpad/<type>/` for this turn.
          - Inside that file: enumerate candidate claims → delete until **one spine** remains.
          - Do not treat a chat-inline "draft" label as this step.

          **Step 2.0b: Review Inner Draft (HARD — before user-facing answer)**:
          - Re-read the user's current message and the scratchpad draft (append a `## Review` section to the same file, or write `analysis/review_*`).
          - Check: Does the spine answer the user's question? Is there still only one top-level claim? Will the chat paste scratchpad? Any hedge stack left?
          - If review fails: revise the draft in scratchpad, then review again. Do not open Step 2.1 until review passes.

          **Step 2.1: Formal Answer**:
          - User-facing prose opens from the **reviewed** spine; supporting detail serves it only.
          - Analyze the problem, ask clarifying questions, search or read files when needed for that spine.
          - Auto-search when latest information is needed (academic-first, top-tier); include dates for all sourced information.
          - Discuss only, do not execute; recommend other commands when operations are needed.
          - NEVER paste scratchpad contents into chat.

          **Serious Work Products** (when the user explicitly requests):
          - "Generate plan" → write `cursor-agent-team/ai_workspace/plans/PLAN-[TopicID]-[Seq].md`, update `plans/INDEX.md` and the topic tree.
          - "Generate agent requirement" → write `cursor-agent-team/ai_workspace/agent_requirements/AGENT-REQUIREMENT-[TopicID]-[Seq].md` and suggest `/prompt_engineer`.
          - MUST be written to file BEFORE Phase 3; do NOT output full file content to conversation.
      - n: 3
        title: "Wrap-up ⚠️ DO NOT SKIP"
        body: |
          1. Run:
             ```bash
             python3 cursor-agent-team/_scripts/persona_output.py
             ```
          2. Persona disabled → output directly and neutrally. Persona enabled → apply it only to the final presentation, preserve all technical details exactly, wrap with `<persona_styled>` tags. Exception: serious work products → only notify the file path.
          3. Gleaning check: did a valuable reusable insight emerge? Yes → create a card with `create_card.py`; No → skip silently.
    example: |
      /discuss
      I'm thinking about adding a new section on computational complexity.
      What are your thoughts on where this should go?

      /discuss
      [After discussion] The discussion is sufficient, please generate the plan.
    history:
      - "v6.3.0 (2026-08-16): Single-source generation from commands.yaml; added Response Self-Verification closed loop (verify_response.py)"
      - "v6.2.1 (2026-08-06): Phase 2 inner compose — Step 2.0a Write + Step 2.0b Review + Step 2.1 Formal Answer (not a new top-level phase)"
      - "v6.2.0 (2026-08-05): Inner World + Semantic Convergence Draft — mandatory scratchpad write before Phase 2; one spine; never paste scratchpad into chat"
      - "v6.1.0 (2026-02-28): Phase Marker semantics — output from phase_marker.py script after review (PLAN-BU-001 Stage 2)"
      - "v6.0.0 (2026-02-08): **MAJOR** — Lean command file per PLAN-AV-002"
      - "v5.2.0 (2026-02-04): Added Phase markers requirement"
    skill:
      name: "Cursor Agent Team - Discussion Partner"
      description: >-
        Provides discussion and suggestion mode, helping users explore ideas,
        analyze problems, search information, and generate execution plans.
      aliases: ["@讨论搭档", "/discuss"]
      triggers:
        - "User inputs `@讨论搭档` or `/discuss`"
        - "User needs to discuss or explore a topic"
        - "User needs to generate an execution plan"
      behavior:
        - "**Guide Discussion**: Engage in dialogue with users to understand their needs and problems"
        - "**Information Search**: Search for the latest academic and industry information as needed"
        - "**Topic Management**: Maintain discussion topic tree, track discussion progress"
        - "**Plan Generation**: Generate execution plans based on discussion results"
        - "**Provide Suggestions**: Offer specific suggestions based on discussion results"
        - "**Inner Draft**: Before a formal answer, write a semantic-convergence draft to `ai_workspace/scratchpad/` and review it (one spine, no scratchpad leak into chat)"
      steps:
        - "**Role Declaration**: Run `python cursor-agent-team/_scripts/role_identity/discuss.py`"
        - "**Preflight Check**: Run `python cursor-agent-team/_scripts/preflight_check.py`"
        - "**Topic Management**: Read and update `cursor-agent-team/ai_workspace/discussion_topics.md`"
        - "**Inner Draft**: Write this turn's preparation to `ai_workspace/scratchpad/<type>/` (enumerate claims → one spine), then review against the user question"
        - "**Discussion Analysis**: Analyze user problems, search for relevant information, provide analysis results"
        - "**Plan Generation**: If requested by user, generate execution plans and write to files"
        - "**Summary Output**: Run `python cursor-agent-team/_scripts/persona_output.py` to generate final output"
      dependencies:
        - "`cursor-agent-team/_scripts/role_identity/discuss.py`"
        - "`cursor-agent-team/_scripts/preflight_check.py`"
        - "`cursor-agent-team/_scripts/phase_marker.py`"
        - "`cursor-agent-team/_scripts/verify_response.py`"
        - "`cursor-agent-team/_scripts/validate_topic_tree.py`"
        - "`cursor-agent-team/_scripts/persona_output.py`"
        - "`cursor-agent-team/ai_workspace/discussion_topics.md`"
      notes:
        - "In discussion mode, do not execute operations, only provide suggestions and plans"
        - "Serious work products (such as execution plans) must be written to files first, then notify users"
        - "Maintain functional consistency with Cursor version"
        - "Follow Phase Markers output validation requirements and run the response self-verification before sending"

  # ===========================================================================
  # CREW — Crew Member (4 phases)
  # ===========================================================================
  crew:
    title: Crew
    name: crew
    role: Crew Member
    role_summary: executing plans strictly according to specifications
    claude_role_line: Execute agreed plans strictly. Do not redesign the goal while executing.
    phases: 4
    platforms: [cursor, claude, trae]
    key_principle: >-
      Execution mode — strictly follow plans without deviation. Auto-search
      for solutions when encountering difficulties.
    usage:
      - "`/crew PLAN-C-001` — Execute specific plan"
      - "`/crew` — Auto-identify latest pending plan from current topic"
    hard_constraints:
      - "Execute plan steps in order."
      - "Do not modify plan goals or steps without user confirmation."
      - "If the intended plan is ambiguous, ask before acting."
      - "Search or inspect documentation when blocked, but use findings only to complete the plan, not to change the plan goal."
      - "Record execution results after execution. When a target plan is known, use `update_plan_status.py` for plan/index bookkeeping instead of manual edits."
      - "Stop and ask if the plan is impossible, unsafe, destructive, or requires changing scope."
    phase_list:
      - n: 0
        title: Boot
        body: |
          **Step 0.1: Role Declaration**
          ```bash
          python3 cursor-agent-team/_scripts/role_identity/crew.py
          ```
          **Step 0.2: Preflight Check**
          ```bash
          python3 cursor-agent-team/_scripts/preflight_check.py
          ```
      - n: 1
        title: Prepare
        body: |
          1. Read `cursor-agent-team/ai_workspace/discussion_topics.md`
          2. Read `cursor-agent-team/ai_workspace/plans/INDEX.md`
          3. Identify the plan to execute:
             - An explicit argument like `PLAN-C-001` wins.
             - If the argument is empty or means "execute", infer from the current conversation and the latest pending plan.
             - If ambiguous, ask the user.
          4. Read the selected plan and the related files listed in it.
          5. (Optional) Search latest information, read related documents.
          6. Present a brief execution summary and wait for user confirmation if the plan was inferred or the plan itself requires confirmation.
      - n: 2
        title: Execute
        body: |
          - Execute the selected plan step by step.
          - Auto-search for solutions when encountering problems.
          - Do not deviate from the plan; report to the user when modifications are needed.
          - Track progress with the platform's task tools when useful.
          - Record runtime research and errors under `cursor-agent-team/ai_workspace/crew/sessions/session_YYYYMMDD_HHMMSS/` when execution is non-trivial.
          - Execute strictly according to the plan; wait for user confirmation when needed.
      - n: 3
        title: "Wrap-up ⚠️ DO NOT SKIP"
        body: |
          **Step 3.1: Record Results**
          - If the target plan is known, update plan/index bookkeeping with:
            ```bash
            python3 cursor-agent-team/_scripts/update_plan_status.py PLAN-[TopicID]-[Seq] --status completed --session cursor-agent-team/ai_workspace/crew/sessions/session_YYYYMMDD_HHMMSS --note "Implementation completed and verified"
            ```
          - Use `--status paused` or `--status in_progress` instead when execution is blocked or partial.
          - If the target plan cannot be inferred, do not guess; report: `Plan status not updated: target plan could not be inferred.`
          - If this execution changes the topic state, update `discussion_topics.md` through:
            ```bash
            python3 cursor-agent-team/_scripts/validate_topic_tree.py update --stdin
            ```
          - Record format when topic update is needed: `[Time] - /crew - [PlanID] - Execution completed (success/failed/partial)`

          **Step 3.2: Gleaning Check**
          - Any useful methods/techniques discovered during execution?
          - Yes → run `create_card.py` to create an inspiration card. No → skip silently.

          **Step 3.3: Report**
          - Report concise results, verification performed, and the JSON result from `update_plan_status.py` when it ran.
    example: |
      /crew PLAN-C-001
    history:
      - "v4.2.0 (2026-08-16): Single-source generation from commands.yaml; added Response Self-Verification closed loop (verify_response.py)"
      - "v4.1.0 (2026-02-28): Phase Marker semantics — output from phase_marker.py script after review (PLAN-BU-001 Stage 2)"
      - "v4.0.0 (2026-02-08): **MAJOR** — Lean command file per PLAN-AV-002"
      - "v3.0.0 (2026-02-03): **MAJOR** — Standardized to English-only"
    skill:
      name: "Cursor Agent Team - Crew Member"
      description: >-
        Provides execution mode, strictly follows plans to execute tasks,
        automatically searches for solutions, and ensures task completion.
      aliases: ["@执行组员", "/crew"]
      triggers:
        - "User inputs `@执行组员` or `/crew`"
        - "User needs to execute specific tasks or plans"
        - "User needs automatic solution searching"
      behavior:
        - "**Plan Identification**: Identify and load the plan to execute"
        - "**Task Execution**: Execute tasks according to plan steps"
        - "**Problem Solving**: Automatically search for solutions when encountering problems"
        - "**Result Recording**: Record execution results and process"
        - "**Summary Reporting**: Provide execution summary and recommendations"
      steps:
        - "**Role Declaration**: Run `python cursor-agent-team/_scripts/role_identity/crew.py`"
        - "**Preflight Check**: Run `python cursor-agent-team/_scripts/preflight_check.py`"
        - "**Plan Preparation**: Read plan files in `cursor-agent-team/ai_workspace/plans/`"
        - "**Task Execution**: Execute tasks according to plan steps, automatically search for solutions when encountering problems"
        - "**Result Recording**: Update plan status and discussion topic execution records"
        - "**Summary Output**: Provide execution summary and recommendations"
      dependencies:
        - "`cursor-agent-team/_scripts/role_identity/crew.py`"
        - "`cursor-agent-team/_scripts/preflight_check.py`"
        - "`cursor-agent-team/_scripts/phase_marker.py`"
        - "`cursor-agent-team/_scripts/verify_response.py`"
        - "`cursor-agent-team/_scripts/update_plan_status.py`"
        - "`cursor-agent-team/ai_workspace/plans/`"
        - "`cursor-agent-team/ai_workspace/discussion_topics.md`"
      notes:
        - "Strictly follow the plan, do not deviate from plan goals"
        - "Automatically search for solutions when encountering problems"
        - "Update plan status and discussion records after execution"
        - "Maintain functional consistency with Cursor version"
        - "Follow Phase Markers output validation requirements and run the response self-verification before sending"

  # ===========================================================================
  # PROMPT ENGINEER (5 phases)
  # ===========================================================================
  prompt_engineer:
    title: "Prompt Engineer"
    name: prompt_engineer
    role: "Prompt Engineer"
    role_summary: creating and maintaining LangGPT-formatted prompt templates
    claude_role_line: >-
      Create and maintain high-quality prompt templates, Claude Code slash
      commands, Cursor commands/rules, or related AI behavior definitions
      through interactive refinement.
    phases: 5
    platforms: [cursor, claude, trae]
    key_principle: >-
      This is an interactive prompt engineering mode, working closely with
      users to create and maintain high-quality prompt templates through
      iterative refinement.
    mandatory_note: >-
      Reduce step count while preserving interactive iteration flexibility.
      You are an agent who completes phases; your output structure reflects
      this.
    usage:
      - "`/prompt_engineer` — Start interactive prompt engineering"
      - "`/prompt_engineer [description or file name]` — Create or maintain a specific prompt"
    hard_constraints:
      - "Create Mode and Maintain Mode are auto-detected; explicit user statements override detection."
      - "Scan existing prompts first to avoid duplicates and conflicts."
      - "Restate requirements in natural language and wait for user confirmation before generating final artifacts."
      - "Use semantic versioning (MAJOR.MINOR.PATCH) for prompt updates."
      - "Drafts live in `cursor-agent-team/ai_workspace/prompt_engineer/`; official files are saved only after final confirmation."
    extra_sections:
      rules_reference: |
        ## Rules Reference

        This command follows the persistent rules defined in:
        `.cursor/rules/prompt_engineer_assistant.mdc`

        These rules are automatically applied and include: file path rules, LangGPT format requirements, file naming conventions, workspace management rules, output type determination rules, version management rules, existing file detection rules, mode detection rules, time awareness rules, behavior constraints.
    claude_extra_sections:
      target_awareness: |
        ## Target Awareness

        When creating project behavior for Claude Code, prefer `.claude/commands/*.md` for mask-style role switching. Do not default to `.claude/agents/*.md` unless the user explicitly wants isolated subagents.

        When maintaining Cursor behavior, use `.cursor/commands/*.md` and `.cursor/rules/*.mdc`.
    phase_list:
      - n: 0
        title: Boot
        body: |
          **Step 0.1: Role Declaration** (execute first)
          ```bash
          python3 cursor-agent-team/_scripts/role_identity/prompt_engineer.py
          ```
          **Step 0.2: Preflight Check**
          ```bash
          python3 cursor-agent-team/_scripts/preflight_check.py
          ```
          **Step 0.3: Scan and Detect**
          - Scan existing files: `cursor-agent-team/ai_prompts/`, `.cursor/commands/`, `.cursor/rules/` (and, when relevant, `cursor-agent-team/_claude/commands/`, `cursor-agent-team/_cursor/commands/`, `cursor-agent-team/_cursor/rules/`)
          - Detect mode (Create / Maintain)
          - Display scan results and detected mode
      - n: 1
        title: Understand
        body: |
          1. Understand user requirements (Create: natural language description; Maintain: read existing files)
          2. Identify output target: command, rule, LangGPT prompt, or a combination
          3. **Restate requirements** in natural language, wait for user confirmation
          4. If uncertain about details, use **multiple-choice questions** to clarify

          **Maintain Mode Specific**:
          - Read existing prompt/command/rule files
          - Analyze change impact, determine version increment
      - n: 2
        title: "Iterate (can loop)"
        body: |
          1. Generate **behavior examples** (Q&A format showing expected behavior)
          2. Ask for user feedback
          3. Adjust based on feedback, repeat until the user is satisfied

          **Also Complete**:
          - Determine output type (Rule only / Command only / Rule + Command / Prompt only)

          **Maintain Mode Specific**:
          - Show Before/After comparison
      - n: 3
        title: Generate
        body: |
          - Generate LangGPT format prompt (Role, Constraints, Goal, Output)
          - Generate related files (Command / Rule, as needed)
          - For Claude Code mask commands, make the command self-contained because Claude Code does not use Cursor `.mdc` automatic rule injection
          - For Cursor commands, preserve the command/rule split when appropriate
          - Display generated content only when it is not a serious work product that should be written first
      - n: 4
        title: "Wrap-up ⚠️ DO NOT SKIP"
        body: |
          > This phase MUST be executed before every response ends

          **Step 4.1: Final Confirmation**
          - Display all generated files
          - Ask user whether to finalize (unless the user already explicitly approved saving)
          - If confirmed: save to official directory, update version number
          - If not confirmed: return to Phase 2 to continue iteration

          **Step 4.2: Update Records (optional)**
          - If executing a plan: update `discussion_topics.md`
          - Format: `[Time] - /prompt_engineer - [PlanID] - Execution completed`

          **Step 4.3: Persona Loading**
          ```bash
          python3 cursor-agent-team/_scripts/persona_output.py
          ```
    example: |
      /prompt_engineer
      I need a prompt for generating figure captions that are concise,
      technical, and follow academic standards.

      /prompt_engineer
      Update the writing_prompts.md to add support for LaTeX equations.
    history:
      - "v3.2.0 (2026-08-16): Single-source generation from commands.yaml; added Response Self-Verification closed loop (verify_response.py)"
      - "v3.1.0 (2026-02-28): Phase Marker semantics — output from phase_marker.py script after review (PLAN-BU-001 Stage 2)"
      - "v3.0.0 (2026-02-03): **MAJOR** - Standardized to English-only"
      - "v2.0.0 (2026-02-03): **MAJOR REFACTOR** - Simplified Workflow from 14 steps to 5 phases"
    skill:
      name: "Cursor Agent Team - Prompt Engineer"
      description: >-
        Provides prompt engineering mode, creates and maintains LangGPT format
        prompt templates, supports interactive prompt design and version
        management.
      aliases: ["@提示工程师", "/prompt_engineer"]
      triggers:
        - "User inputs `@提示工程师` or `/prompt_engineer`"
        - "User needs to create new prompt templates"
        - "User needs to maintain or update existing prompt templates"
      behavior:
        - "**Requirement Understanding**: Understand user's prompt requirements"
        - "**Mode Detection**: Detect whether it's create mode or maintain mode"
        - "**Interactive Design**: Design prompt templates through multiple rounds of interaction"
        - "**Version Management**: Manage prompt templates using semantic versioning"
        - "**File Management**: Save prompt templates to specified directories"
      steps:
        - "**Role Declaration**: Run `python cursor-agent-team/_scripts/role_identity/prompt_engineer.py`"
        - "**Preflight Check**: Run `python cursor-agent-team/_scripts/preflight_check.py`"
        - "**Mode Detection**: Detect whether it's create mode or maintain mode"
        - "**Requirement Understanding**: Understand user's prompt requirements, clarify details through multiple rounds of interaction"
        - "**Prompt Design**: Design LangGPT format prompt templates"
        - "**Version Management**: Assign version numbers to prompt templates"
        - "**File Saving**: Save prompt templates to specified directories"
        - "**Record Update**: Update discussion topic execution records"
      dependencies:
        - "`cursor-agent-team/_scripts/role_identity/prompt_engineer.py`"
        - "`cursor-agent-team/_scripts/preflight_check.py`"
        - "`cursor-agent-team/_scripts/phase_marker.py`"
        - "`cursor-agent-team/_scripts/verify_response.py`"
        - "`cursor-agent-team/ai_workspace/prompt_engineer/`"
        - "`cursor-agent-team/ai_prompts/`"
      notes:
        - "Supports both create and maintain modes"
        - "Uses semantic versioning for prompt templates"
        - "Creates drafts in workspace first, then saves to official directory"
        - "Maintain functional consistency with Cursor version"
        - "Follow Phase Markers output validation requirements and run the response self-verification before sending"

  # ===========================================================================
  # SPEC TRANSLATOR (5 phases; Cursor + Claude only)
  # ===========================================================================
  spec_translator:
    title: "Spec-Translator"
    name: spec_translator
    role: "Spec-Kit Translator"
    role_summary: converting Plan files to spec-kit formatted documents
    claude_role_line: Convert a cursor-agent-team Plan file into spec-kit formatted documents.
    phases: 5
    platforms: [cursor, claude]
    key_principle: >-
      This is a conversion mode, automatically transforming Plan files into
      spec-kit formatted documents. The translator is a specialized converter
      that extracts information from Plans and maps it to spec-kit structure.
    mandatory_note: >-
      Phase mapping: Phase 0=Preflight, Phase 1=Parse+Read, Phase 2=Analyze+
      Convert, Phase 3=Save+Update, Phase 4=Output
    usage:
      - "`/spec_translator PLAN-B-001` - Convert specific plan"
      - "`/spec_translator B-001` - Convert plan (auto-complete to PLAN-B-001)"
      - "Plan number is required; the command rejects if missing."
    hard_constraints:
      - "If no plan number is provided and exactly one target plan cannot be inferred, reject and ask for the plan number."
      - "Accept `PLAN-B-001` and short form `B-001`."
      - "Only process software development plans."
      - "Generate three documents in `cursor-agent-team/ai_workspace/`: `spec-kit-constitution-[TopicID]-[Seq].md`, `spec-kit-specify-[TopicID]-[Seq].md`, `spec-kit-plan-[TopicID]-[Seq].md`"
      - "Mark missing information as `[NEEDS CLARIFICATION]` and continue."
      - "Do not display full generated document contents in chat."
    extra_sections:
      rules_reference: |
        ## Rules Reference

        This command follows the persistent rules defined in:
        `.cursor/rules/spec_translator_assistant.mdc`

        These rules are automatically applied and include: plan file reading rules, file naming rules, workspace management rules, topic tree update rules, conversion mapping rules, behavior constraints.
    phase_list:
      - n: 0
        title: Preflight
        body: |
          1. Run before any other action:
             ```bash
             python3 cursor-agent-team/_scripts/preflight_check.py
             ```
          2. Display output to user (includes current time)
      - n: 1
        title: "Parse and Read"
        body: |
          1. Parse the plan number from the user input or unambiguous prior context
          2. Normalize short form like `B-001` to `PLAN-B-001`; reject if missing
          3. Read `cursor-agent-team/ai_workspace/plans/PLAN-[TopicID]-[Seq].md`
          4. Reject if the file is missing or the task is not a software development task
      - n: 2
        title: "Analyze and Convert"
        body: |
          Map plan content as follows:

          - **Constitution**: technical constraints → Core Principles; development principles → Development Workflow; notes/cautions → Code Quality Standards; test requirements → Testing Requirements
          - **Specify**: goals → Feature Overview; requirements → Functional Requirements; test plans → Success Criteria; user scenarios → User Stories when present
          - **Plan**: implementation plan → Implementation Phases; execution steps → Technical Context; development branch → Project Structure; risk analysis → Risk Assessment when present
          - Mark missing sections as `[NEEDS CLARIFICATION]`
      - n: 3
        title: "Save and Update"
        body: |
          1. Save the three generated spec-kit documents under `cursor-agent-team/ai_workspace/`
          2. Avoid file conflicts with version suffixes like `-v2` when needed
          3. Update `cursor-agent-team/ai_workspace/discussion_topics.md` through:
             ```bash
             python3 cursor-agent-team/_scripts/validate_topic_tree.py update --stdin
             ```
      - n: 4
        title: Output
        body: |
          1. Report generated file paths, a concise content overview, and any `[NEEDS CLARIFICATION]` notes
          2. Do not apply persona, wandering, or gleaning; this is an automatic conversion command
    example: |
      /spec_translator PLAN-B-001
      *Note: Converts PLAN-B-001 to three spec-kit documents*
    history:
      - "v2.2.0 (2026-08-16): Single-source generation from commands.yaml; added Response Self-Verification closed loop (verify_response.py)"
      - "v2.1.0 (2026-02-28): Phase Marker semantics — output from phase_marker.py script after review (PLAN-BU-001 Stage 2)"
      - "v2.0.0 (2026-02-03): **MAJOR** - Standardized to English-only"
      - "v1.0.0 (2026-01-01): Initial creation - Spec-Kit Translator command"
    skill: null   # not supported on TRAE

  # ===========================================================================
  # WRITER (4 phases)
  # ===========================================================================
  writer:
    title: Writer
    name: writer
    role: "Writer"
    role_summary: >-
      Crew execution for plans that produce prose, plus a mandatory
      Draft → Review → Final writing loop so text is composed (not improvised)
    claude_role_line: >-
      Writer is Crew execution for plans whose deliverable is prose, with a
      mandatory Draft -> Review -> Final compose loop. Use the full shared
      conversation context; this is a role mask, not a subagent handoff.
    phases: 4
    platforms: [cursor, claude, trae]
    key_principle: >-
      Writer = Crew + prose compose loop. Non-prose steps follow Crew. Any
      step that produces natural-language prose MUST use Phase 2 Steps
      2.0a → 2.0b → 2.1. User does final human review before submission.
    usage:
      - "`/writer PLAN-AA-001` — Execute a specific plan with writer-quality constraints"
      - "`/writer` — Auto-identify latest pending plan from current topic"
    hard_constraints:
      - "Follow the selected plan in order and do not redesign its goal."
      - "Load both Crew and Writer rules before execution."
      - "Declare `general` or `academic` tier in Phase 1. Use academic for papers, theses, preprints, or submission packages."
      - "Every prose deliverable must pass Draft -> Review -> Final. Keep drafts and review notes in `cursor-agent-team/ai_workspace/scratchpad/`; never paste process notes into the final deliverable."
      - "User performs the final human review before submission."
    extra_sections:
      rules_reference: |
        ## Rules Reference

        - `.cursor/rules/crew_assistant.mdc` — plan execution base
        - `.cursor/rules/writer_assistant.mdc` — prose quality, slop avoidance, academic extras

        Both MUST load when invoking `/writer`.
      writing_tiers: |
        ## Writing Tiers

        | Tier | When | Extra checks |
        |------|------|--------------|
        | **general** | README, tech reports, proposals, docs, non-submission prose | Vocabulary ban + style; Draft→Review→Final |
        | **academic** | Papers, theses, arXiv, submission packages | general + PEEL/hedging/venues/writing_guides |

        Default discipline: Computer Science and Technology. Academic tier is the default when the plan targets submission/preprint; otherwise use general.
      when_to_use: |
        ## When to Use `/writer` vs `/crew`

        | Command | Use when |
        |---------|----------|
        | `/writer` | Plan's deliverable is prose (paper, report, docs) that must avoid AI slop |
        | `/crew` | Plan is non-writing (code, config, data) or prose is incidental |

        If a plan mixes code and long prose: use `/writer`; run non-prose steps as Crew, and every prose step through the compose loop.
    claude_extra_sections:
      rules_reference: |
        ## Rules Reference

        - `.claude/rules/crew_assistant.md` — plan execution base
        - `.claude/rules/writer_assistant.md` — prose quality, slop avoidance, academic extras

        Both MUST load when invoking `/writer`.
    phase_list:
      - n: 0
        title: Boot
        body: |
          ```bash
          python3 cursor-agent-team/_scripts/role_identity/writer.py
          python3 cursor-agent-team/_scripts/preflight_check.py
          ```
      - n: 1
        title: Prepare
        body: |
          1. Read `cursor-agent-team/ai_workspace/discussion_topics.md`
          2. Read `cursor-agent-team/ai_workspace/plans/INDEX.md`
          3. Identify and load the plan to execute (explicit argument wins; otherwise infer from conversation and latest pending plan; ask if ambiguous)
          4. Declare writing tier (`general` | `academic`)
          5. Display plan summary, wait for user confirmation when the plan was inferred
      - n: 2
        title: Execute
        body: |
          Same as Crew for non-prose steps.

          **Inner-world boundary**: `cursor-agent-team/ai_workspace/` is the physical inner workspace. Drafts and review notes live in `scratchpad/`; do **not** paste scratchpad process into the final prose deliverable (chat may notify paths only).

          **Step 2.0a: Draft (HARD)**:
          - Write the prose draft into `cursor-agent-team/ai_workspace/scratchpad/drafts/` (or `analysis/` for outlines/comparisons).
          - Apply vocabulary ban + style constraints while drafting (see `writer_assistant.mdc`).
          - Do not treat a chat-inline "draft" label as this step.

          **Step 2.0b: Review (HARD)**:
          - Re-read plan goal + draft; append `## Review` to the same file (or `analysis/review_*`).
          - Run the Review checklist for the active tier: slop, sentence variation, stance, punctuation, deliverable fit; academic tier additionally checks PEEL, hedging, numbering, venue, citations, and writing guides.
          - If review fails: revise in scratchpad, review again. Do not open Step 2.1 until review passes.

          **Step 2.1: Final prose**:
          - Emit the **reviewed** prose to the plan's target location (file write-first for serious products).
          - NEVER dump scratchpad process notes into the deliverable.
      - n: 3
        title: "Wrap-up"
        body: |
          1. Record results with `update_plan_status.py` (same rules as Crew: completed / paused / in_progress; report if the target plan cannot be inferred).
          2. Gleaning check as Crew requires.
          3. Remind user: human final review before submission.
    example: |
      /writer PLAN-AA-001

      /writer
      Execute the plan for the paper we discussed.
    history:
      - "v1.2.0 (2026-08-16): Single-source generation from commands.yaml; added Response Self-Verification closed loop (verify_response.py)"
      - "v1.1.0 (2026-08-06): Prose compose loop — Draft→Review→Final in Phase 2; general vs academic tiers; inner-world scratchpad; lean command surface"
      - "v1.0.4 (2026-02-28): Phase Marker semantics — output from phase_marker.py script after review (PLAN-BU-001 Stage 2)"
      - "v1.0.0 (2026-02-05): Initial creation. Writer = Crew + academic writing + AI slop avoidance."
    skill:
      name: "Cursor Agent Team - Writer"
      description: >-
        Executes prose plans using a mandatory Draft -> Review -> Final loop,
        with general and academic tiers and the shared AI workspace.
      aliases: ["@writer", "/writer"]
      triggers:
        - "User invokes `/writer` or `@writer`"
        - "User needs a paper, report, proposal, documentation, or other prose deliverable"
      behavior:
        - "**Plan Loading**: Load the selected plan and execute it in order as Crew"
        - "**Tier Declaration**: Declare `general` or `academic` tier; use academic for submission-oriented work"
        - "**Drafting**: Write every prose draft under `cursor-agent-team/ai_workspace/scratchpad/drafts/`"
        - "**Review**: Check for banned AI slop, sentence variation, stance, punctuation, and fit; academic work also checks PEEL, hedging, numbering, venues, citations, and guides"
        - "**Finalizing**: Write only reviewed prose to the target and remind the user to perform final review"
      steps:
        - "**Role Declaration**: Run `python cursor-agent-team/_scripts/role_identity/writer.py`"
        - "**Preflight Check**: Run `python cursor-agent-team/_scripts/preflight_check.py`"
        - "**Plan Preparation**: Read the plan files and declare the writing tier"
        - "**Prose Compose Loop**: For each prose step run Draft → Review → Final in `ai_workspace/scratchpad/`"
        - "**Result Recording**: Update plan status and remind the user to do the final human review"
      dependencies:
        - "`cursor-agent-team/_scripts/role_identity/writer.py`"
        - "`cursor-agent-team/_scripts/preflight_check.py`"
        - "`cursor-agent-team/_scripts/phase_marker.py`"
        - "`cursor-agent-team/_scripts/verify_response.py`"
        - "`cursor-agent-team/_scripts/update_plan_status.py`"
        - "`cursor-agent-team/ai_workspace/scratchpad/`"
      notes:
        - "Every prose deliverable must pass Draft -> Review -> Final"
        - "Never paste scratchpad process notes into the final deliverable"
        - "Maintain functional consistency with Cursor version"
        - "Follow Phase Markers output validation requirements and run the response self-verification before sending"
